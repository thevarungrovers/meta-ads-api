# Hard bounds on what the MCP server will apply to the live Meta ad account.
#
# COMMITTED ON PURPOSE. Every limit here is also a code constant in
# metaads_mcp/guardrails.py; this file only overrides them. Committing it means
# raising a limit is a visible diff with an author and a date, rather than an
# env var someone exported once and nobody can find afterwards.
#
# A key you delete falls back to the code default. A key you misspell is an
# error at startup, not a silently ignored line.
#
# These numbers apply to a live account with campaigns serving and spending
# today. Meta offers no sandbox worth pointing this at, so there is no safe
# rehearsal: every apply is the real thing.
#
# AMOUNTS HERE ARE IN THE ACCOUNT'S CURRENCY, NOT MINOR UNITS. "500.00" means
# five hundred, not five. The conversion to the integer Meta wants happens in
# metaads_reporting/currency.py.

[limits]
# --- per-call bounds ---------------------------------------------------------
max_daily_budget            = "500.00"  # decimal string, account currency
max_budget_change_pct       = 50.0      # relative to the current budget
max_bid_amount              = "50.00"   # bid cap / cost target ceiling
max_bid_increase_pct        = 50.0
max_entities_per_call       = 25
max_projected_delta_per_day = "200.00"  # upper bound on extra daily spend

# --- per-session bounds ------------------------------------------------------
# These matter more than the per-call ones. A per-call limit does nothing to
# stop a runaway loop making 400 individually-legal changes; a session counter
# does.
max_applies_per_session     = 20
max_projected_session_delta = "500.00"

[scope]
# Ad account ids the server may touch, as bare digits with no `act_` prefix.
# EMPTY means "whatever META_ADS_ACCOUNT_ID in .env points at, and nothing
# else" -- which is the safe default, because one System User token routinely
# reaches every account a business owns.
allowed_account_ids = []

# Campaign ids the server may change. EMPTY means every campaign in the allowed
# account. Pin this to one campaign for the first week, then widen.
allowed_campaign_ids = []

# Currencies a write may be denominated in. A limit of "500.00" means nothing
# until you know 500.00 of what -- and on Meta it means even less than usual,
# because the API integer behind it is 50000 on a USD account and 500 on a JPY
# one.
allowed_currencies = ["CAD"]
